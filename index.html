<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Minnesota Geography Quiz Game</title>
</head>
<body>
    <h1>Minnesota Geography Quiz Game</h1>
    <span id="score">0 of 5</span>
    <p id="question">Question 1</p>
    <div>
        <input type="radio" id="choice-1" name="answer" value="answer-1">
        <label for="choice-1" id="label-1">Answer 1</label>
    </div>
    <div>
        <input type="radio" id="choice-2" name="answer" value="answer-2">
        <label for="choice-2" id="label-2">Answer 2</label>
    </div>
    <div>
        <input type="radio" id="choice-3" name="answer" value="answer-3">
        <label for="choice-3" id="label-3">Answer 3</label>
    </div>
    <div>
        <input type="radio" id="choice-4" name="answer" value="answer-4">
        <label for="choice-4" id="label-4">Answer 4</label>
    </div>
    <div>
        <button id="submit">Submit</button>
    </div>
    <div>
        <button id="next">Next</button>
    </div>
    <p id="feedback">You got this!</p>
    <script src="script.js"></script>
</body>
</html>
